<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#0284C7"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="678" rx="15" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Top Bar / Power BI Navigation -->
  <rect x="0" y="0" width="1200" height="60" rx="16" fill="#0B0F19"/>
  <rect x="0" y="44" width="1200" height="16" fill="#0B0F19"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Power BI Icon & Title -->
  <rect x="24" y="16" width="28" height="28" rx="6" fill="#F2C811"/>
  <path d="M30 36V28M36 36V24M42 36V20M48 36V26" stroke="#1E1E1E" stroke-width="2" stroke-linecap="round"/>
  <text x="64" y="35" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Power BI Decision Center</text>
  <text x="270" y="35" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="14">|</text>
  <text x="290" y="35" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14" font-weight="500">Pilotage Supply Chain &amp; OTIF — AGRANA Fruit</text>

  <!-- Filters / Controls -->
  <rect x="830" y="14" width="160" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="844" y="35" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">Client: Tous (Laiterie Soummam)</text>
  <rect x="1005" y="14" width="90" height="32" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="1020" y="35" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="12">Période: M-1</text>
  <circle cx="1145" cy="30" r="14" fill="#312E81"/>
  <text x="1140" y="35" fill="#A5B4FC" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">SH</text>

  <!-- KPI CARDS ROW -->
  <!-- Card 1: OTIF -->
  <g transform="translate(24, 80)">
    <rect width="270" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">TAUX DE SERVICE OTIF (STRICT)</text>
    <text x="20" y="74" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="34" font-weight="800">94.8%</text>
    <rect x="165" y="48" width="85" height="26" rx="13" fill="#064E3B" stroke="#059669"/>
    <text x="178" y="65" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">▲ +2.4%</text>
    <text x="20" y="96" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">Cible contractuelle : ≥ 92.0%</text>
  </g>

  <!-- Card 2: Commande vs Livraison -->
  <g transform="translate(318, 80)">
    <rect width="270" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">COMMANDE VS LIVRAISON</text>
    <text x="20" y="74" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="34" font-weight="800">98.2%</text>
    <rect x="165" y="48" width="85" height="26" rx="13" fill="#0C4A6E" stroke="#0284C7"/>
    <text x="178" y="65" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Conforme</text>
    <text x="20" y="96" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">Besoins bruts MP honorés</text>
  </g>

  <!-- Card 3: Commandes à Risque -->
  <g transform="translate(612, 80)">
    <rect width="270" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">COMMANDES À RISQUE / ALERTES</text>
    <text x="20" y="74" fill="#F59E0B" font-family="Segoe UI, sans-serif" font-size="34" font-weight="800">12</text>
    <rect x="170" y="48" width="80" height="26" rx="13" fill="#451A03" stroke="#D97706"/>
    <text x="183" y="65" fill="#FBBF24" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Reliquats</text>
    <text x="20" y="96" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">Anticipation des ruptures en cours</text>
  </g>

  <!-- Card 4: Volume total -->
  <g transform="translate(906, 80)">
    <rect width="270" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">VOLUME TOTAL LIVRÉ (MOIS)</text>
    <text x="20" y="74" fill="#A855F7" font-family="Segoe UI, sans-serif" font-size="34" font-weight="800">14 850 <tspan font-size="18">T</tspan></text>
    <text x="20" y="96" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11">Prévisions de vente : 15 100 T</text>
  </g>

  <!-- MAIN CHART: Performance Mensuelle & OTIF Trend -->
  <g transform="translate(24, 210)">
    <rect width="760" height="440" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="24" y="36" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Évolution Temporelle des Livraisons &amp; OTIF par Mois</text>
    <text x="24" y="56" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="12">Ingestion automatique Bronze → Gold / Modèle en étoile Power BI</text>

    <!-- Legend -->
    <rect x="520" y="24" width="12" height="12" rx="3" fill="#6366F1"/>
    <text x="538" y="35" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="11">Commandes</text>
    <rect x="620" y="24" width="12" height="12" rx="3" fill="#06B6D4"/>
    <text x="638" y="35" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="11">Livraisons</text>
    <circle cx="705" cy="30" r="4" fill="#34D399"/>
    <text x="715" y="35" fill="#CBD5E1" font-family="Segoe UI, sans-serif" font-size="11">OTIF %</text>

    <!-- Grid lines -->
    <line x1="60" y1="100" x2="720" y2="100" stroke="#1E293B" stroke-dasharray="4"/>
    <line x1="60" y1="160" x2="720" y2="160" stroke="#1E293B" stroke-dasharray="4"/>
    <line x1="60" y1="220" x2="720" y2="220" stroke="#1E293B" stroke-dasharray="4"/>
    <line x1="60" y1="280" x2="720" y2="280" stroke="#1E293B" stroke-dasharray="4"/>
    <line x1="60" y1="340" x2="720" y2="340" stroke="#334155"/>

    <!-- Y-axis labels -->
    <text x="48" y="104" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="end">100%</text>
    <text x="48" y="164" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="end">75%</text>
    <text x="48" y="224" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="end">50%</text>
    <text x="48" y="284" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="end">25%</text>
    <text x="48" y="344" fill="#64748B" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="end">0</text>

    <!-- Bars & Labels (6 months) -->
    <!-- Jan -->
    <rect x="90" y="150" width="22" height="190" rx="4" fill="url(#barGrad1)"/>
    <rect x="116" y="165" width="22" height="175" rx="4" fill="url(#barGrad2)"/>
    <text x="114" y="365" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Jan</text>

    <!-- Fév -->
    <rect x="195" y="130" width="22" height="210" rx="4" fill="url(#barGrad1)"/>
    <rect x="221" y="145" width="22" height="195" rx="4" fill="url(#barGrad2)"/>
    <text x="219" y="365" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Fév</text>

    <!-- Mar -->
    <rect x="300" y="110" width="22" height="230" rx="4" fill="url(#barGrad1)"/>
    <rect x="326" y="125" width="22" height="215" rx="4" fill="url(#barGrad2)"/>
    <text x="324" y="365" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Mar</text>

    <!-- Avr -->
    <rect x="405" y="120" width="22" height="220" rx="4" fill="url(#barGrad1)"/>
    <rect x="431" y="130" width="22" height="210" rx="4" fill="url(#barGrad2)"/>
    <text x="429" y="365" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Avr</text>

    <!-- Mai -->
    <rect x="510" y="90" width="22" height="250" rx="4" fill="url(#barGrad1)"/>
    <rect x="536" y="100" width="22" height="240" rx="4" fill="url(#barGrad2)"/>
    <text x="534" y="365" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Mai</text>

    <!-- Juin -->
    <rect x="615" y="80" width="22" height="260" rx="4" fill="url(#barGrad1)"/>
    <rect x="641" y="90" width="22" height="250" rx="4" fill="url(#barGrad2)"/>
    <text x="639" y="365" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Juin</text>

    <!-- OTIF Trend Line overlay -->
    <path d="M114 175 Q 219 155 324 135 T 534 105 T 639 95" fill="none" stroke="#10B981" stroke-width="3"/>
    <circle cx="114" cy="175" r="5" fill="#10B981" stroke="#0F172A" stroke-width="2"/>
    <circle cx="219" cy="155" r="5" fill="#10B981" stroke="#0F172A" stroke-width="2"/>
    <circle cx="324" cy="135" r="5" fill="#10B981" stroke="#0F172A" stroke-width="2"/>
    <circle cx="429" cy="140" r="5" fill="#10B981" stroke="#0F172A" stroke-width="2"/>
    <circle cx="534" cy="105" r="5" fill="#10B981" stroke="#0F172A" stroke-width="2"/>
    <circle cx="639" cy="95" r="5" fill="#10B981" stroke="#0F172A" stroke-width="2"/>

    <!-- Bottom note -->
    <rect x="30" y="390" width="700" height="34" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="46" y="412" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">⚡ Mesure DAX :</text>
    <text x="145" y="412" fill="#CBD5E1" font-family="Courier New, monospace" font-size="11">OTIF_Strict = DIVIDE(CALCULATE(COUNTROWS(FactLivraisons), ConformeTemps=1, ConformeQte=1), TotalCommandes)</text>
  </g>

  <!-- SIDE CHARTS: Segmentation & Schema -->
  <!-- Box 1: Segmentation Clients / Préparations de fruits -->
  <g transform="translate(808, 210)">
    <rect width="368" height="210" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Segmentation Grands Comptes</text>
    <text x="20" y="50" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11">Répartition volumes livrés</text>

    <!-- Donut Simulation -->
    <circle cx="90" cy="125" r="55" fill="none" stroke="#1E293B" stroke-width="24"/>
    <circle cx="90" cy="125" r="55" fill="none" stroke="#6366F1" stroke-width="24" stroke-dasharray="160 360" stroke-dashoffset="0"/>
    <circle cx="90" cy="125" r="55" fill="none" stroke="#06B6D4" stroke-width="24" stroke-dasharray="90 360" stroke-dashoffset="-165"/>
    <circle cx="90" cy="125" r="55" fill="none" stroke="#10B981" stroke-width="24" stroke-dasharray="55 360" stroke-dashoffset="-260"/>
    <circle cx="90" cy="125" r="55" fill="none" stroke="#F59E0B" stroke-width="24" stroke-dasharray="35 360" stroke-dashoffset="-320"/>

    <text x="90" y="125" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="15" font-weight="800" text-anchor="middle">100%</text>
    <text x="90" y="140" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Vol. Global</text>

    <!-- Legend items -->
    <circle cx="180" cy="85" r="5" fill="#6366F1"/>
    <text x="195" y="90" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Laiterie Soummam (48%)</text>

    <circle cx="180" cy="115" r="5" fill="#06B6D4"/>
    <text x="195" y="120" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11">Industriels Laitiers (27%)</text>

    <circle cx="180" cy="145" r="5" fill="#10B981"/>
    <text x="195" y="150" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11">Boissons &amp; Jus (15%)</text>

    <circle cx="180" cy="175" r="5" fill="#F59E0B"/>
    <text x="195" y="180" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="11">Boulangerie/Glaces (10%)</text>
  </g>

  <!-- Box 2: Modèle Physique de Données (MPD Star Schema) -->
  <g transform="translate(808, 440)">
    <rect width="368" height="210" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Architecture Modèle en Étoile (MPD)</text>
    <text x="20" y="50" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="11">Relations 1-N unifiées dans Power BI</text>

    <!-- Mini Schema Nodes -->
    <!-- Center Fact Table -->
    <rect x="124" y="95" width="120" height="42" rx="6" fill="#312E81" stroke="#6366F1" stroke-width="1.5"/>
    <text x="184" y="121" fill="#EEF2FF" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Fact_Livraisons</text>

    <!-- Dimension Nodes -->
    <rect x="20" y="70" width="80" height="28" rx="4" fill="#0F172A" stroke="#0284C7"/>
    <text x="60" y="88" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Dim_Client</text>

    <rect x="20" y="145" width="80" height="28" rx="4" fill="#0F172A" stroke="#0284C7"/>
    <text x="60" y="163" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Dim_Produit</text>

    <rect x="268" y="70" width="80" height="28" rx="4" fill="#0F172A" stroke="#0284C7"/>
    <text x="308" y="88" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Dim_Temps</text>

    <rect x="268" y="145" width="80" height="28" rx="4" fill="#0F172A" stroke="#0284C7"/>
    <text x="308" y="163" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Dim_Statut</text>

    <!-- Connectors -->
    <line x1="100" y1="84" x2="124" y2="105" stroke="#64748B" stroke-width="1.5"/>
    <line x1="100" y1="159" x2="124" y2="128" stroke="#64748B" stroke-width="1.5"/>
    <line x1="268" y1="84" x2="244" y2="105" stroke="#64748B" stroke-width="1.5"/>
    <line x1="268" y1="159" x2="244" y2="128" stroke="#64748B" stroke-width="1.5"/>

    <text x="184" y="195" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">✓ Couches Bronze &amp; Gold validées</text>
  </g>
</svg>
