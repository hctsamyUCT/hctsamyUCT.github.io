name: SEO
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check static content is current
        run: node scripts/render-seo.mjs --check
      - name: Check SEO, links and structured data
        run: python3 scripts/check_seo.py
